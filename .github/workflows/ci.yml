name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Typecheck, tests et intégrité des données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests du moteur de notation
        run: npm test

      - name: Intégrité du jeu de données
        run: npm run lint:data

      - name: Build de production
        run: npx vite build
