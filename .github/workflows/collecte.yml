name: Collecte des déclarations

on:
  schedule:
    # Les sources par défaut sont gratuites : la fréquence n'est plus un
    # arbitrage de budget, seulement de fraîcheur et de courtoisie envers les
    # serveurs interrogés.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Aucun secret n'est requis : les sources par défaut sont publiques,
      # gratuites et sans clé. X n'est interrogé que si un jeton est fourni.
      - name: Collecter
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          if [ -n "$X_BEARER_TOKEN" ]; then
            npm run collecte:citations -- --sources=sites,bluesky,veille,x
          else
            npm run collecte:citations
          fi

      - name: Contrôler l’instantané produit
        run: npm test

      - name: Publier la mise à jour
        run: |
          if git diff --quiet public/donnees/factcheck.json; then
            echo "Aucune nouvelle citation."
            exit 0
          fi
          git config user.name "collecte-citations"
          git config user.email "noreply@github.com"
          git add public/donnees/factcheck.json
          git commit -m "Collecter les déclarations publiées depuis la dernière exécution"
          git push
