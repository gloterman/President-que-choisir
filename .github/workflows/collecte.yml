name: Collecte des déclarations

on:
  schedule:
    # Une fois par jour. Chaque lecture étant facturée, la fréquence est un
    # arbitrage coût contre fraîcheur : à ajuster selon le budget.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Vérifier la présence du jeton
        id: jeton
        run: |
          if [ -z "${{ secrets.X_BEARER_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Aucun jeton X_BEARER_TOKEN configuré : collecte ignorée."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collecter
        if: steps.jeton.outputs.present == 'true'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run collecte:citations

      - name: Contrôler l’instantané produit
        if: steps.jeton.outputs.present == 'true'
        run: npm test

      - name: Publier la mise à jour
        if: steps.jeton.outputs.present == 'true'
        run: |
          if git diff --quiet public/donnees/factcheck.json; then
            echo "Aucune nouvelle citation."
            exit 0
          fi
          git config user.name "collecte-citations"
          git config user.email "noreply@github.com"
          git add public/donnees/factcheck.json
          git commit -m "Collecter les déclarations publiées depuis la dernière exécution"
          git push
