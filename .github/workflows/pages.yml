name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        # Aucun BASE_PATH : l'archive est en chemins relatifs et fonctionne
        # aussi bien sous le sous-chemin de GitHub Pages qu'à la racine d'un
        # domaine propre. C'est ce qui permet de changer d'hébergeur sans
        # recompiler — et de ne pas dépendre de celui-ci.
        run: npm run build

      - name: Portabilité de l’archive
        run: npm run check:portability

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
